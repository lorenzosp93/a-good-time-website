<!doctype html>
<html lang="$lang">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f7f2e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1719" media="(prefers-color-scheme: dark)">
  <title>$title — A Good Time</title>
  <meta name="description" content="$intro">
  <link rel="canonical" href="$canonical">
  $alternates
  <link rel="icon" type="image/png" href="${base}/assets/app-icon-small.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="${base}/assets/app-icon-dark.png" media="(prefers-color-scheme: dark)">
  <style>$styles</style>
</head>
<body class="privacy-page">
  <a class="skip-link" href="#main">$skip</a>
  <header class="site-header wrap">
    <a class="brand" href="${base}/${lang}/"><picture><source media="(prefers-color-scheme: dark)" srcset="${base}/assets/app-icon-dark.png"><img src="${base}/assets/app-icon-small.png" width="42" height="42" alt=""></picture><span>A Good Time</span></a>
    <nav class="languages" aria-label="$language_label">$languages</nav>
  </header>
  <main id="main" class="wrap support-main">
    <div class="support-intro"><h1>$title</h1><p class="hero-description">$intro</p><p class="small-note">$updated_label: $updated</p></div>
    <div class="policy-body">$sections</div>
  </main>
  <footer class="site-footer wrap"><a class="brand" href="${base}/${lang}/">A Good Time</a><nav class="footer-links" aria-label="$support_link"><a href="${base}/${lang}/support/">$support_link</a><a href="${base}/${lang}/privacy/" aria-current="page">$privacy_link</a></nav></footer>
</body>
</html>
