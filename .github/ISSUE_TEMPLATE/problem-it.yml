{
  "name": "Chiedi aiuto / segnala un problema · Italiano",
  "description": "Racconta cosa volevi fare e cosa è successo. Non serve conoscere la causa.",
  "labels": [
    "support",
    "needs-triage"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "GitHub richiede un account. Segnalazioni, risposte e allegati sono pubblici. Per informazioni private o se non hai un account GitHub, usa l’email.\n\nCondividi solo ciò che serve. Rimuovi nomi delle attività, dettagli del calendario, luoghi e altre informazioni personali dalle schermate. Nulla viene caricato automaticamente. GitHub e il tuo provider email elaborano ciò che scegli di inviare.\n\n[Contatta privatamente via email](https://agoodtime.to/it/support/#private)"
      }
    },
    {
      "type": "dropdown",
      "id": "surface",
      "attributes": {
        "label": "Dove succede?",
        "description": "Scegli l’app o il sito a cui si riferisce la richiesta.",
        "options": [
          "iPhone",
          "Apple Watch",
          "Sito web"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "answer-1",
      "attributes": {
        "label": "Cosa volevi fare?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "answer-2",
      "attributes": {
        "label": "Cosa è successo?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "answer-3",
      "attributes": {
        "label": "Cosa ti aspettavi?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "answer-4",
      "attributes": {
        "label": "Versione dell’app e del sistema operativo",
        "description": "Nell’app: Impostazioni → Aiuto e privacy → Copia informazioni tecniche. Per il sito, indica browser e versione del sistema operativo se li conosci. Se non lo sai, scrivi «non so»."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "additional",
      "attributes": {
        "label": "Passaggi o schermate (facoltativo)",
        "description": "Se possibile, spiega come riprodurre il problema. Rimuovi le informazioni personali prima di allegare qualcosa."
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "checkboxes",
      "id": "public-consent",
      "attributes": {
        "label": "Assistenza",
        "options": [
          {
            "label": "Capisco che questa segnalazione e gli eventuali allegati saranno pubblici.",
            "required": true
          }
        ]
      }
    }
  ]
}
