{
  "name": "Suggest an improvement · English",
  "description": "Help make an existing part of A Good Time easier or more useful.",
  "labels": [
    "improvement",
    "needs-triage"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "GitHub requires an account. Reports, replies and attachments are public. For private details or without a GitHub account, use email instead.\n\nOnly share what is needed. Remove task names, calendar details, locations and other personal information from screenshots. Nothing is uploaded automatically. GitHub and your email provider process what you choose to send.\n\n[Contact privately by email](https://agoodtime.to/en/support/#private)"
      }
    },
    {
      "type": "dropdown",
      "id": "surface",
      "attributes": {
        "label": "Where does this happen?",
        "description": "Choose the app or website this concerns.",
        "options": [
          "iPhone",
          "Apple Watch",
          "Website"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "answer-1",
      "attributes": {
        "label": "Which existing experience could be better?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "answer-2",
      "attributes": {
        "label": "What would you like to accomplish?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "additional",
      "attributes": {
        "label": "Your proposed change (optional)"
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "checkboxes",
      "id": "public-consent",
      "attributes": {
        "label": "Support",
        "options": [
          {
            "label": "I understand this report and any attachments will be public.",
            "required": true
          }
        ]
      }
    }
  ]
}
